# Issue and PR labels for LinkShield AI
#
# Run the setup-labels workflow to sync these labels to the repository.

# Type labels
- name: "bug"
  color: "d73a4a"
  description: "Something isn't working"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request"

- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to documentation"

- name: "security"
  color: "e11d48"
  description: "Security vulnerability or improvement"

- name: "dependencies"
  color: "0366d6"
  description: "Pull requests that update a dependency file"

# Component labels
- name: "backend"
  color: "5319e7"
  description: "Related to the FastAPI backend"

- name: "frontend"
  color: "1d76db"
  description: "Related to the React frontend"

- name: "browser-extension"
  color: "d4c5f9"
  description: "Related to the browser extension"

- name: "ml-model"
  color: "f9d0c4"
  description: "Related to the ML phishing detection model"

# Priority labels
- name: "priority: critical"
  color: "b60205"
  description: "Must be resolved immediately"

- name: "priority: high"
  color: "d93f0b"
  description: "Should be resolved soon"

- name: "priority: medium"
  color: "fbca04"
  description: "Normal priority"

- name: "priority: low"
  color: "0e8a16"
  description: "Nice to have"

# Status labels
- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"

- name: "wontfix"
  color: "ffffff"
  description: "This will not be worked on"

- name: "duplicate"
  color: "cfd3d7"
  description: "This issue or pull request already exists"

- name: "invalid"
  color: "e4e669"
  description: "This doesn't seem right"
